stages:
  prepare:
    cmd: python -m src.make_dataset
    deps:
      - github-issues-dataset/github_issues_dataset.parquet
      - src/preprocess.py
      - src/taxonomy.py
      - src/make_dataset.py
    outs:
      - data/processed/issues_clean.parquet
  split:
    cmd: python -m src.make_splits
    deps:
      - data/processed/issues_clean.parquet
      - src/make_splits.py
    params:
      - split
    outs:
      - data/splits
